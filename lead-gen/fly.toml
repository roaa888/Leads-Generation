app = "leadgeneration"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT               = "8000"
  LEADGEN_RUNTIME_DIR = "/data"

[[mounts]]
  source      = "leadgen_data"
  destination = "/data"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "1gb"
  cpu_kind = "shared"
  cpus     = 1
